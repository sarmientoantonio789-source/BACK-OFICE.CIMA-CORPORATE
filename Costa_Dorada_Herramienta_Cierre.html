<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Costa Dorada — Herramienta de Ayuda Exclusiva</title>
<style>
  :root{
    --dark:#14181f; --panel:#1c222c; --panel2:#222a36; --border:#2a323e;
    --text:#e9edf3; --muted:#8b96a5; --gold:#e0b13a;
    --disponible:#1e8e4a; --disponible-bg:#123321;
    --vendido:#d64545; --vendido-bg:#3a1919;
    --separado:#d6a029; --separado-bg:#3a2c12;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--dark); color:var(--text); padding-bottom:50px; }
  header{ position:sticky; top:0; z-index:20; background:var(--panel); border-bottom:1px solid var(--border); padding:12px 14px 8px 14px; }
  h1{ margin:0 0 10px 0; font-size:16px; font-weight:700; }
  h1 span{ color:var(--gold); }
  .tabs{ display:flex; gap:6px; overflow-x:auto; }
  .tab{
    flex-shrink:0; padding:8px 12px; border-radius:8px; font-size:12.5px; font-weight:600;
    background:#0f1319; border:1px solid var(--border); color:var(--muted); cursor:pointer;
  }
  .tab.active{ background:var(--gold); color:#1a1a1a; border-color:var(--gold); }

  .panel{ padding:12px 14px; border-bottom:1px solid var(--border); background:var(--panel2); display:none; }
  .panel.active{ display:block; }
  input[type=text], input[type=number]{
    width:100%; padding:11px 12px; font-size:16px; border-radius:9px; border:1px solid var(--border);
    background:#0f1319; color:var(--text); outline:none; margin-top:4px;
  }
  input:focus{ border-color:var(--gold); }
  label{ font-size:12px; color:var(--muted); font-weight:600; display:block; margin-top:10px; }
  label:first-child{ margin-top:0; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip{
    padding:7px 12px; border-radius:20px; font-size:12px; font-weight:600;
    background:#0f1319; border:1px solid var(--border); color:var(--muted); cursor:pointer;
  }
  .chip.on{ background:var(--gold); color:#1a1a1a; border-color:var(--gold); }
  .btn{
    margin-top:12px; width:100%; padding:13px; border-radius:9px; border:none;
    background:var(--gold); color:#1a1a1a; font-weight:700; font-size:15px; cursor:pointer;
  }
  .btn.secondary{ background:#0f1319; color:var(--muted); border:1px solid var(--border); margin-top:8px; }
  .mini-filters{ display:flex; gap:6px; padding:8px 14px; overflow-x:auto; background:var(--dark); }
  select{ background:#0f1319; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:7px; font-size:12.5px; flex-shrink:0; }
  .stats{ padding:6px 14px 0 14px; font-size:12px; color:var(--muted); }
  .stats b{ color:var(--text); }
  #results{ padding:12px 14px; }
  .empty{ text-align:center; color:var(--muted); margin-top:40px; font-size:13.5px; line-height:1.7; padding:0 20px; }
  .card{ background:var(--panel); border:1px solid var(--border); border-left-width:5px; border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .card.disponible{ border-left-color:var(--disponible); }
  .card.vendido{ border-left-color:var(--vendido); }
  .card.separado{ border-left-color:var(--separado); }
  .card.otro{ border-left-color:var(--muted); }
  .card-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .lote-id{ font-size:18px; font-weight:700; }
  .lote-id .etapa-tag{ font-size:10px; font-weight:600; color:var(--muted); border:1px solid var(--border); border-radius:5px; padding:1px 5px; margin-left:6px; vertical-align:middle; }
  .badge{ font-size:11px; font-weight:700; text-transform:uppercase; padding:3px 9px; border-radius:20px; }
  .badge.disponible{ background:var(--disponible-bg); color:#4ade80; }
  .badge.vendido{ background:var(--vendido-bg); color:#f87171; }
  .badge.separado{ background:var(--separado-bg); color:#facc15; }
  .badge.otro{ background:#22262e; color:var(--muted); }
  .esquina-flag{ display:inline-block; margin-left:6px; font-size:10px; background:#2a2116; color:var(--gold); border-radius:5px; padding:2px 6px; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:4px 14px; font-size:13px; color:var(--muted); margin-top:6px; }
  .grid div b{ color:var(--text); font-weight:600; }
  .categoria{ margin-top:8px; font-size:12px; color:var(--gold); font-weight:600; }
  .match-info{ margin-top:6px; font-size:11.5px; color:#7dd3fc; font-weight:600; }
  .precio-row{ margin-top:8px; display:flex; justify-content:space-between; align-items:baseline; border-top:1px dashed var(--border); padding-top:8px; }
  .precio{ font-size:19px; font-weight:800; }
  .preciom2{ font-size:12px; color:var(--muted); }
  .financiamiento{ margin-top:8px; background:#0f1319; border-radius:8px; padding:8px 10px; font-size:12.5px; }
  .financiamiento .cuota{ font-size:16px; font-weight:800; color:var(--gold); }
  .promo-note{
    margin-top:6px; font-size:11px; font-weight:700; color:#1a1a1a;
    background:linear-gradient(90deg,#ffb020,#ff8a20);
    border-radius:6px; padding:5px 9px; display:inline-block;
  }
  .cuota-note{ margin-top:8px; font-size:11px; color:var(--muted); display:flex; justify-content:space-between; align-items:center; }
  .cuota-note a{ color:var(--gold); text-decoration:none; font-weight:600; }
  footer{ text-align:center; color:var(--muted); font-size:11px; padding:20px 14px 0 14px; }
</style>
</head>
<body>

<header>
  <h1>Costa Dorada <span>· Herramienta de Ayuda Exclusiva</span></h1>
  <div class="tabs">
    <div class="tab active" data-tab="buscar">🔎 Buscar</div>
    <div class="tab" data-tab="presupuesto">💰 Presupuesto</div>
    <div class="tab" data-tab="cotizar">📊 Cotizar</div>
    <div class="tab" data-tab="medidas">📐 Medidas</div>
    <div class="tab" data-tab="categoria">📍 Categoría</div>
  </div>
</header>

<div class="panel active" data-panel="buscar">
  <label>Manzana y lote (ej: R1 5, o solo R1, o solo 14)</label>
  <input id="search" type="text" inputmode="search" placeholder="Escribe aquí..." autocomplete="off">
</div>

<div class="panel" data-panel="presupuesto">
  <div class="row2">
    <div>
      <label>Inicial disponible del cliente (S/)</label>
      <input id="p-inicial" type="number" placeholder="Ej: 15000">
    </div>
    <div>
      <label>Plazo deseado (meses, máx. 48)</label>
      <input id="p-plazo" type="number" placeholder="Ej: 36" max="48">
    </div>
  </div>
  <label>Cuota mensual máxima que puede pagar (opcional)</label>
  <input id="p-cuotamax" type="number" placeholder="Ej: 1500">
  <button class="btn" id="btn-presupuesto">Buscar lotes que calcen en ese presupuesto</button>
</div>

<div class="panel" data-panel="cotizar">
  <label>Precio del lote que le gustó al cliente (S/)</label>
  <input id="c-precio" type="number" placeholder="Ej: 72340">
  <div class="row2">
    <div>
      <label>Inicial disponible (S/)</label>
      <input id="c-inicial" type="number" placeholder="Ej: 15000">
    </div>
    <div>
      <label>Plazo (meses, máx. 48)</label>
      <input id="c-plazo" type="number" placeholder="Ej: 36" max="48">
    </div>
  </div>
  <button class="btn" id="btn-cotizar">Calcular cuota y ver alternativas</button>
</div>

<div class="panel" data-panel="medidas">
  <div class="row2">
    <div>
      <label>Área deseada (m²)</label>
      <input id="m-area" type="number" placeholder="Ej: 200">
    </div>
    <div>
      <label>Frente deseado (m)</label>
      <input id="m-frente" type="number" placeholder="Ej: 10">
    </div>
  </div>
  <button class="btn" id="btn-medidas">Buscar los más cercanos</button>
</div>

<div class="panel" data-panel="categoria">
  <label>Selecciona una o varias (se combinan)</label>
  <div class="chips" id="cat-chips">
    <div class="chip" data-kw="AV">Avenida</div>
    <div class="chip" data-kw="PROYECTADA">Av. Proyectada</div>
    <div class="chip" data-kw="ESQUINA">Esquina</div>
    <div class="chip" data-kw="PARQUE">Parque</div>
    <div class="chip" data-kw="CICLOVÍA">Ciclovía</div>
    <div class="chip" data-kw="ALAMEDA">Alameda</div>
    <div class="chip" data-kw="CALLE">Calle</div>
    <div class="chip" data-kw="CENTRO COMERCIAL">Centro Comercial</div>
  </div>
  <button class="btn" id="btn-categoria">Buscar por categoría</button>
</div>

<div class="mini-filters">
  <select id="f-etapa">
    <option value="">Todas las etapas</option>
    <option value="Etapa 1">Etapa 1</option>
    <option value="Etapa 2">Etapa 2</option>
    <option value="Etapa 3">Etapa 3</option>
  </select>
  <select id="f-estado">
    <option value="disponible" selected>Solo disponibles</option>
    <option value="">Todos los estados</option>
    <option value="separado">Separado</option>
    <option value="vendido">Vendido</option>
  </select>
</div>

<div class="stats" id="stats"></div>
<div id="results"></div>
<footer>Costa Dorada · Herramienta de Ayuda Exclusiva · Cuota inicial real: verificar en <a href="https://usesire.com/ver_plano_publico.php?plano_id=251&ref=416&wb=0" style="color:#e0b13a">plano en vivo</a>.</footer>

<script>
const DATA = JSON.parse(document.getElementById('lot-data').textContent);
const resultsEl = document.getElementById('results');
const statsEl = document.getElementById('stats');
const fEtapa = document.getElementById('f-etapa');
const fEstado = document.getElementById('f-estado');

let currentMode = 'buscar';
let activeCats = new Set();

// ---------- Tabs ----------
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.querySelector(`.panel[data-panel="${t.dataset.tab}"]`).classList.add('active');
    currentMode = t.dataset.tab;
  });
});

document.querySelectorAll('#cat-chips .chip').forEach(c => {
  c.addEventListener('click', () => {
    c.classList.toggle('on');
    if (c.classList.contains('on')) activeCats.add(c.dataset.kw);
    else activeCats.delete(c.dataset.kw);
  });
});

function normEstado(e){
  if (e === 'disponible' || e === 'vendido' || e === 'separado') return e;
  return 'otro';
}
function num(v){ const n = parseFloat(String(v).replace(/[^\d.]/g,'')); return isNaN(n) ? null : n; }
function fmtMoney(n){ return 'S/ ' + n.toLocaleString('es-PE', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function promoNote(plazo){
  if (plazo > 36) {
    return `<div class="promo-note">⚠️ Plazo de ${plazo} meses es PROMOCIONAL (máx. regular: 36 meses) — válido solo hasta el 19 de julio</div>`;
  }
  return '';
}

function baseFilter(){
  return DATA.filter(d => {
    if (fEtapa.value && d.etapa !== fEtapa.value) return false;
    if (fEstado.value && d.estado !== fEstado.value) return false;
    return true;
  });
}

function renderStats(list){
  statsEl.innerHTML = `<b>${list.length}</b> resultados`;
}

function cardHTML(d, extra){
  const estadoNorm = normEstado(d.estado);
  const precioNum = num(d.precio);
  const precioFmt = precioNum ? fmtMoney(precioNum) : (d.precio || 'Sin precio');
  const esHistorico = String(d.precio||'').includes('histórico');
  let financHTML = '';
  if (extra && extra.cuota !== undefined) {
    financHTML = `<div class="financiamiento">
      Con inicial de <b>${fmtMoney(extra.inicial)}</b> a <b>${extra.plazo} meses</b>:
      cuota mensual <span class="cuota">${fmtMoney(extra.cuota)}</span>
      ${promoNote(extra.plazo)}
    </div>`;
  }
  let matchHTML = '';
  if (extra && extra.matchLabel) {
    matchHTML = `<div class="match-info">${extra.matchLabel}</div>`;
  }
  return `
  <div class="card ${estadoNorm}">
    <div class="card-top">
      <div class="lote-id">${d.manzana}-${d.lote} <span class="etapa-tag">${d.etapa.replace('Etapa ','E')}</span>${d.es_esquina ? '<span class="esquina-flag">ESQUINA</span>' : ''}</div>
      <div class="badge ${estadoNorm}">${d.estado}</div>
    </div>
    <div class="categoria">${d.categoria || '—'}</div>
    <div class="grid">
      <div><b>${d.area || '—'}</b> m²</div>
      <div>Frente <b>${d.frente || '—'}</b></div>
      <div>Fondo <b>${d.fondo || '—'}</b></div>
      <div>Largo <b>${d.largo || '—'}</b></div>
    </div>
    ${matchHTML}
    <div class="precio-row">
      <div class="precio">${precioFmt}</div>
      <div class="preciom2">${d.preciom2 ? 'S/ '+d.preciom2+' /m²' : ''}</div>
    </div>
    ${financHTML}
    <div class="cuota-note">
      <span>${esHistorico ? 'Precio histórico — no vigente' : 'Cuota inicial real: verificar en vivo'}</span>
      <a href="https://usesire.com/ver_plano_publico.php?plano_id=251&ref=416&wb=0" target="_blank">Plano en vivo →</a>
    </div>
  </div>`;
}

function renderListHTML(list, cap=100){
  if (list.length === 0) return '';
  return list.slice(0, cap).map(x => cardHTML(x.d, x.extra)).join('') +
    (list.length > cap ? `<div class="empty">Mostrando ${cap} de ${list.length} — afina la búsqueda para ver más.</div>` : '');
}
function renderList(list, cap=100){
  if (list.length === 0) {
    resultsEl.innerHTML = `<div class="empty">Sin resultados. Ajusta los filtros o los valores buscados.</div>`;
    return;
  }
  resultsEl.innerHTML = renderListHTML(list, cap);
}

// ---------- Modo: Buscar ----------
function parseQuery(q){
  q = q.trim().toUpperCase();
  if (!q) return null;
  const m = q.match(/^([A-Z]+[0-9]?)\s*-?\s*([0-9]+)$/);
  if (m && /[A-Z]/.test(m[1])) return { manzana: m[1], lote: m[2] };
  return { free: q };
}
function matchesQuery(d, parsed){
  if (!parsed) return true;
  if (parsed.manzana) {
    if (d.manzana.toUpperCase() !== parsed.manzana) return false;
    if (parsed.lote && d.lote !== parsed.lote) return false;
    return true;
  }
  const q = parsed.free;
  return d.manzana.toUpperCase().includes(q) || String(d.lote).includes(q) || (d.categoria||'').toUpperCase().includes(q);
}
function runBuscar(){
  const q = document.getElementById('search').value;
  const parsed = parseQuery(q);
  const base = baseFilter();
  if (!q) {
    renderStats(base);
    resultsEl.innerHTML = `<div class="empty">Escribe una manzana y lote (ej: <b>R1 5</b>) o usa las otras pestañas.<br>${DATA.length} lotes cargados.</div>`;
    return;
  }
  const list = base.filter(d => matchesQuery(d, parsed)).map(d => ({d}));
  renderStats(list);
  renderList(list, 300);
}
document.getElementById('search').addEventListener('input', runBuscar);

// ---------- Modo: Presupuesto ----------
document.getElementById('btn-presupuesto').addEventListener('click', () => {
  const inicial = num(document.getElementById('p-inicial').value);
  const plazo = num(document.getElementById('p-plazo').value);
  const cuotaMax = num(document.getElementById('p-cuotamax').value);
  if (!inicial || !plazo) {
    resultsEl.innerHTML = `<div class="empty">Ingresa al menos la inicial y el plazo en meses.</div>`;
    return;
  }
  const plazoFinal = Math.min(plazo, 48);
  const base = baseFilter().filter(d => d.estado === 'disponible' || !fEstado.value);

  let dentro = [];
  let cercanos = [];

  base.forEach(d => {
    const precio = num(d.precio);
    if (!precio) return;
    const financiado = precio - inicial;
    const cuota = financiado > 0 ? financiado / plazoFinal : 0;

    if (!cuotaMax || cuota <= cuotaMax) {
      dentro.push({ d, extra: { cuota, inicial, plazo: plazoFinal }, sortKey: cuota });
    } else {
      // ¿Cuánta inicial adicional necesitaría para bajar la cuota a su máximo?
      const inicialNecesaria = precio - (cuotaMax * plazoFinal);
      const inicialExtra = inicialNecesaria - inicial;
      // ¿O cuánto más de cuota mensual le faltaría, si prefiere mantener su inicial?
      const cuotaExtra = cuota - cuotaMax;
      cercanos.push({
        d,
        extra: {
          cuota, inicial, plazo: plazoFinal,
          matchLabel: `💡 Con ${fmtMoney(inicialExtra)} más de inicial (total ${fmtMoney(inicialNecesaria)}), la cuota baja a tu tope · o pagando ${fmtMoney(cuotaExtra)} más al mes`
        },
        sortKey: inicialExtra
      });
    }
  });

  dentro.sort((a,b) => a.sortKey - b.sortKey);
  cercanos.sort((a,b) => a.sortKey - b.sortKey);

  renderStats(dentro.length ? dentro : cercanos);

  if (dentro.length > 0) {
    let html = renderListHTML(dentro, 100);
    if (cuotaMax && cercanos.length > 0) {
      html += `<div class="empty" style="margin-top:18px;">— Con un poco más de esfuerzo también podría alcanzar —</div>`;
      html += renderListHTML(cercanos.slice(0, 10), 10);
    }
    resultsEl.innerHTML = html;
  } else if (cercanos.length > 0) {
    resultsEl.innerHTML = `<div class="empty">Ningún lote calza exacto con ese presupuesto y cuota máxima.<br>Estas son las opciones más cercanas — lo que le faltaría al cliente para alcanzarlas:</div>` + renderListHTML(cercanos, 15);
  } else {
    resultsEl.innerHTML = `<div class="empty">No hay lotes disponibles con precio registrado para calcular. Prueba sin el tope de cuota mensual.</div>`;
  }
});

// ---------- Modo: Medidas ----------
document.getElementById('btn-medidas').addEventListener('click', () => {
  const areaObj = num(document.getElementById('m-area').value);
  const frenteObj = num(document.getElementById('m-frente').value);
  if (!areaObj && !frenteObj) {
    resultsEl.innerHTML = `<div class="empty">Ingresa área y/o frente deseado.</div>`;
    return;
  }
  const base = baseFilter();
  let list = [];
  base.forEach(d => {
    const area = num(d.area);
    const frente = num(d.frente);
    let score = 0, parts = [];
    if (areaObj) {
      if (!area) return;
      score += Math.abs(area - areaObj) / areaObj;
      parts.push(`${area} m² (dif. ${(area-areaObj>=0?'+':'')}${(area-areaObj).toFixed(1)})`);
    }
    if (frenteObj) {
      if (!frente) return;
      score += Math.abs(frente - frenteObj) / frenteObj;
      parts.push(`frente ${frente} (dif. ${(frente-frenteObj>=0?'+':'')}${(frente-frenteObj).toFixed(1)})`);
    }
    list.push({ d, extra: { matchLabel: '📐 ' + parts.join(' · ') }, sortKey: score });
  });
  list.sort((a,b) => a.sortKey - b.sortKey);
  renderStats(list);
  renderList(list, 50);
});

// ---------- Modo: Categoría ----------
document.getElementById('btn-categoria').addEventListener('click', () => {
  if (activeCats.size === 0) {
    resultsEl.innerHTML = `<div class="empty">Selecciona al menos una categoría.</div>`;
    return;
  }
  const base = baseFilter();
  const kws = Array.from(activeCats);
  let list = base.filter(d => {
    const cat = (d.categoria||'').toUpperCase();
    return kws.every(kw => cat.includes(kw));
  }).map(d => ({ d, extra: { matchLabel: '📍 Coincide con: ' + kws.join(' + ') } }));
  renderStats(list);
  renderList(list, 150);
});

// ---------- Modo: Cotizar (lote específico + alternativas) ----------
document.getElementById('btn-cotizar').addEventListener('click', () => {
  const precioObj = num(document.getElementById('c-precio').value);
  const inicial = num(document.getElementById('c-inicial').value);
  const plazo = num(document.getElementById('c-plazo').value);
  if (!precioObj || !inicial || !plazo) {
    resultsEl.innerHTML = `<div class="empty">Ingresa precio, inicial y plazo para calcular.</div>`;
    return;
  }
  const plazoFinal = Math.min(plazo, 48);
  const financiadoObj = precioObj - inicial;
  const cuotaObj = financiadoObj > 0 ? financiadoObj / plazoFinal : 0;

  // Tarjeta resumen del cálculo tal cual
  const resumenHTML = `
    <div class="card disponible" style="border-left-color:var(--gold);">
      <div class="card-top"><div class="lote-id">Cálculo para este lote</div></div>
      <div class="grid">
        <div>Precio <b>${fmtMoney(precioObj)}</b></div>
        <div>Inicial <b>${fmtMoney(inicial)}</b></div>
        <div>Plazo <b>${plazoFinal} meses</b></div>
        <div>Financiado <b>${fmtMoney(Math.max(financiadoObj,0))}</b></div>
      </div>
      <div class="financiamiento" style="margin-top:10px;">
        Cuota mensual resultante: <span class="cuota">${fmtMoney(cuotaObj)}</span>
        ${promoNote(plazoFinal)}
      </div>
    </div>
  `;

  // Alternativas: mismo presupuesto (inicial+plazo), precio cercano al ingresado, en ambas direcciones
  const base = baseFilter().filter(d => d.estado === 'disponible' || !fEstado.value);
  let alternativas = [];
  base.forEach(d => {
    const precio = num(d.precio);
    if (!precio) return;
    const financiado = precio - inicial;
    const cuota = financiado > 0 ? financiado / plazoFinal : 0;
    const deltaPrecio = precio - precioObj;
    const deltaCuota = cuota - cuotaObj;
    const signo = deltaPrecio >= 0 ? '+' : '';
    alternativas.push({
      d,
      extra: {
        cuota, inicial, plazo: plazoFinal,
        matchLabel: `${deltaPrecio===0?'Mismo precio':'Precio '+signo+fmtMoney(deltaPrecio)} · cuota ${deltaCuota>=0?'+':''}${fmtMoney(deltaCuota)}/mes vs. tu cálculo`
      },
      sortKey: Math.abs(deltaPrecio)
    });
  });
  alternativas.sort((a,b) => a.sortKey - b.sortKey);
  alternativas = alternativas.slice(0, 20);

  // Segunda sección: misma cuota objetivo, pero variando el plazo (otros precios que calzan igual con distinto N° de meses)
  let alternativasPlazo = [];
  base.forEach(d => {
    const precio = num(d.precio);
    if (!precio) return;
    const financiado = precio - inicial;
    if (financiado <= 0 || cuotaObj <= 0) return;
    const plazoNecesario = financiado / cuotaObj;
    if (plazoNecesario < 1 || plazoNecesario > 48) return; // fuera de rango viable
    const plazoRedondeado = Math.round(plazoNecesario);
    const cuotaReal = financiado / plazoRedondeado;
    // Evitar duplicar lotes que ya casi calzan al mismo plazo original (esos ya salen en la 1ra lista)
    if (Math.abs(plazoRedondeado - plazoFinal) < 2) return;
    alternativasPlazo.push({
      d,
      extra: {
        cuota: cuotaReal, inicial, plazo: plazoRedondeado,
        matchLabel: `⏱️ Mismo pago (~${fmtMoney(cuotaObj)}/mes) a ${plazoRedondeado} meses en vez de ${plazoFinal} · precio ${precio>=precioObj?'+':''}${fmtMoney(precio-precioObj)}`
      },
      sortKey: Math.abs(plazoRedondeado - plazoFinal)
    });
  });
  alternativasPlazo.sort((a,b) => a.sortKey - b.sortKey);
  alternativasPlazo = alternativasPlazo.slice(0, 15);

  renderStats([...alternativas, ...alternativasPlazo]);
  let html = resumenHTML +
    `<div class="empty" style="margin-top:16px;">— Alternativas con precio cercano, misma inicial y plazo —</div>` +
    renderListHTML(alternativas, 20);
  if (alternativasPlazo.length > 0) {
    html += `<div class="empty" style="margin-top:16px;">— Mismo pago mensual, ajustando el plazo —</div>` +
      renderListHTML(alternativasPlazo, 15);
  }
  resultsEl.innerHTML = html;
});

fEtapa.addEventListener('change', () => {
  if (currentMode === 'buscar') runBuscar();
});
fEstado.addEventListener('change', () => {
  if (currentMode === 'buscar') runBuscar();
});

runBuscar();
</script>
